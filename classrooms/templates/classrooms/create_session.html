{% extends "base.html" %}
{% block title %}Create Session{% endblock %}
{% block content %}

<div class="container mt-5">
  <!-- Header -->
  <div class="text-center mb-4">
    <h2 class="fw-bold">➕ Create New Session</h2>
    <p class="text-muted">Fill in the details to schedule a class for your students</p>
  </div>

  <!-- Form Card -->
  <div class="row justify-content-center">
    <div class="col-md-6">
      <form method="post" class="card shadow-lg border-0 rounded-3">
        {% csrf_token %}
        <div class="card-body p-4">

          <!-- Title -->
          <div class="mb-3">
            <label class="form-label fw-bold">📌 Title</label>
            <input type="text" name="title" class="form-control" placeholder="Enter class title" required>
          </div>

          <!-- Subject -->
          <div class="mb-3">
            <label class="form-label fw-bold">📘 Subject</label>
            <input type="text" name="subject" class="form-control" placeholder="Enter subject" required>
          </div>

          <!-- Date -->
          <div class="mb-3">
            <label class="form-label fw-bold">📅 Date</label>
            <input type="date" name="date" class="form-control" required>
          </div>

          <!-- Time Inputs -->
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label fw-bold">🕒 Start Time</label>
              <input type="time" name="start_time" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label fw-bold">🕔 End Time</label>
              <input type="time" name="end_time" class="form-control" required>
            </div>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn btn-primary w-100 fw-bold">
            💾 Save Session
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

{% endblock %}
